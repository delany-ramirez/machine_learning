# Entorno conda para el curso de Machine Learning (solo Python).
#
#   conda env create -f environment.yml
#   conda activate ml-curso
#   python -m ipykernel install --user --name ml-curso --display-name "Python (ml-curso)"
#   jupyter lab
#
# Ver docs/guia-entorno.md para la instalación paso a paso y alternativas.

name: ml-curso
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip

  # --- Núcleo científico ---
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.13
  - scikit-learn>=1.5
  - statsmodels>=0.14        # OLS con summary, VIF (módulo 3)

  # --- Visualización ---
  - matplotlib>=3.8
  - seaborn>=0.13

  # --- Entorno de trabajo ---
  - jupyterlab>=4.2
  - ipykernel>=6.29
  - ipywidgets>=8.1

  # --- Recolección de datos (módulo 2) ---
  - requests>=2.32
  - beautifulsoup4>=4.12
  - lxml>=5.2

  # --- Ensambles e interpretabilidad (módulo 4) ---
  - xgboost>=2.1
  - lightgbm>=4.5
  - imbalanced-learn>=0.12   # manejo de clases desbalanceadas
  - shap>=0.46

  # --- Optimización de hiperparámetros (módulo 3) ---
  - optuna>=3.6

  # --- Reducción de dimensionalidad y deep learning (módulo 5) ---
  - umap-learn>=0.5
  - pytorch-cpu>=2.4         # PyTorch solo CPU. Se instala desde conda-forge y no con pip
                             # porque la rueda de pip falla al importar en Windows dentro de
                             # un entorno conda (shm.dll). Ver docs/guia-entorno.md si tienes GPU.

  # --- MLOps (módulos 2 y 6) ---
  - mlflow>=2.16
  - fastapi>=0.115
  - uvicorn>=0.30
  - dvc>=3.55

  - pip:
      - ucimlrepo>=0.0.7     # descarga de datasets del UCI ML Repository
